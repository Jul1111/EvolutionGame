[project]
name = "evolution-game"
version = "0.1.0"
description = "Simulation de sélection naturelle : des créatures à réseau de neurones évoluent sur un monde torique."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = ["numpy>=2.2", "pygame-ce>=2.5.8"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"

[tool.ruff]
line-length = 120
extend-exclude = ["graphify-out", "experiments/results"]   # Archived analysis scripts, kept as they ran

[tool.ruff.lint]
select = ["E", "F", "W"]

[tool.ruff.lint.per-file-ignores]
# Texts shown to the player: one string per line, longer lines are easier to read than broken strings
"rendering/ui/overlay/texts.py" = ["E501"]

[tool.coverage.run]
source = ["."]
omit = ["tests/*", ".venv/*", "graphify-out/*"]

[tool.coverage.report]
skip_covered = true
show_missing = true
fail_under = 80   # Safety net: current coverage is ~83%, a drop below means a new feature without tests

[tool.mypy]
ignore_missing_imports = true   # pygame-ce and numpy are only partly typed
exclude = ["graphify-out", ".venv", "experiments/results"]   # Archived analysis scripts, kept as they ran
